import com.android.build.gradle.internal.tasks.FinalizeBundleTask

plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.edu.mimuw.students.pl249278.android.musicinput'
    compileSdkVersion 36

    def releaseSigningStorePath = System.getenv("SIGNING_STORE_PATH")
    def hasReleaseSigningConfig = releaseSigningStorePath &&
            System.getenv("SIGNING_STORE_PASSWORD") &&
            System.getenv("SIGNING_KEY_ALIAS") &&
            System.getenv("SIGNING_KEY_PASSWORD")

    defaultConfig {
        applicationId "pl.waw.echo.choirbuddy"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 7
        versionName "1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile file(releaseSigningStorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    applicationVariants.all { variant ->
        def artifactName = "${rootProject.name}-${variant.name}-${variant.versionCode}-${variant.versionName}"
        variant.outputs.all {
            outputFileName = "${artifactName}.apk"
        }
        tasks.named("sign${variant.name.capitalize()}Bundle", FinalizeBundleTask) {
            File file = finalBundleFile.asFile.get()
            File finalFile = new File(file.parentFile, "${artifactName}.aab")
            finalBundleFile.set(finalFile)
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation project(path: ':svgCommon')
    implementation name: 'joda-primitives-1.0'
    implementation name: 'plurals'
    implementation name: 'MIDICreator'
    implementation project(path: ':flowLayout')
    implementation project(path: ':asyncService')
    implementation project(path: ':logUtil')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.guava:guava:30.1-android'

}
